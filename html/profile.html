<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matematika.uz</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/profile-style.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav>
      <div class="nav-logo">
        <div class="logo-icon">MU</div>
        <div class="logo-text">
          <h2>Matematika.uz</h2>
          <p>test platformasi</p>
        </div>
      </div>
      <div class="nav-center">
        <button class="btn-home" onclick="location.href = 'bosh-sahifa.html'">
          <svg width="15" height="15" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10 2L2 9h2v9h5v-5h2v5h5V9h2L10 2z" />
          </svg>
          Bosh sahifa
        </button>
        <button class="btn-profile active">
          <svg
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
          </svg>
          Profilim
        </button>
      </div>
      <div class="nav-right">
        <div class="user-code">
          00-913
          <svg
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path d="M6 9l6 6 6-6" />
          </svg>
        </div>
        <div class="notif-badge">0</div>
      </div>
    </nav>

    <!-- MAIN -->
    <main>
      <!-- TABS -->
      <div class="tabs-card">
        <button class="tab-btn" id="tab-parol" onclick="switchTab('parol')">
          <svg
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          Parol
        </button>
        <button
          class="tab-btn active"
          id="tab-natija"
          onclick="switchTab('natija')"
        >
          <svg
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path d="M6 20V10M12 20V4M18 20v-6" />
          </svg>
          Natijalarim
        </button>
        <!-- payment tab removed -->
      </div>

      <!-- TAB: NATIJALARIM -->
      <div id="page-natija" class="tab-page active">
        <h1 class="page-title">Natijalarim</h1>
        <p class="page-sub">Sizning barcha test natijalaringiz</p>

        <div class="empty-card" id="emptyState">
          <div class="empty-icon">
            <svg
              width="40"
              height="40"
              fill="none"
              stroke="#bbb"
              stroke-width="1.5"
              viewBox="0 0 24 24"
            >
              <path
                d="M6 9H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-2"
              />
              <path d="M12 2v13M8 6l4-4 4 4" />
              <circle cx="12" cy="19" r="1" fill="#bbb" />
            </svg>
          </div>
          <h3>Hali test ishlamadingiz</h3>
          <p>
            Testlardan birini boshlang va natijalaringiz shu yerda ko'rinadi
          </p>
          <button class="btn-start" onclick="location.href = 'test.html'">
            Testlarni ko'rish &nbsp;›
          </button>
        </div>

        <!-- Results list (shown after tests) -->
        <div id="resultsList" style="display: none"></div>
      </div>

      <!-- TAB: PAROL -->
      <div id="page-parol" class="tab-page">
        <h1 class="page-title">Parolni o'zgartirish</h1>
        <p class="page-sub">
          Hisobingiz xavfsizligi uchun kuchli parol tanlang
        </p>

        <div class="form-card">
          <div class="form-group">
            <label>Joriy parol</label>
            <input type="password" placeholder="••••••••" id="oldPass" />
          </div>
          <div class="form-group">
            <label>Yangi parol</label>
            <input type="password" placeholder="••••••••" id="newPass" />
          </div>
          <div class="form-group">
            <label>Yangi parolni tasdiqlang</label>
            <input type="password" placeholder="••••••••" id="confirmPass" />
          </div>
          <button class="btn-save" onclick="savePassword()">Saqlash</button>
          <div id="passMsg" class="form-msg"></div>
        </div>
      </div>
      <!-- payment tab removed -->
    </main>

    <script type="module" src="../api.js"></script>
    <script src="../js/profile-app.js"></script>
  </body>
</html>
