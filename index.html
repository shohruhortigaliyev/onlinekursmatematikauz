<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kirish — Matematika.uz</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="login-style.css" />
  </head>
  <body>
    <div class="bg">
      <div class="circle c1"></div>
      <div class="circle c2"></div>
      <div class="circle c3"></div>
    </div>

    <div class="login-wrap">
      <!-- LOGO -->
      <div class="login-logo">
        <div class="logo-icon">MU</div>
        <div>
          <h1>Matematika.uz</h1>
          <p>test platformasi</p>
        </div>
      </div>

      <!-- CARD -->
      <div class="login-card">
        <!-- TABS -->
        <div class="tabs">
          <button class="tab active" id="tab-user" onclick="switchTab('user')">
            Foydalanuvchi
          </button>
          <button class="tab" id="tab-admin" onclick="switchTab('admin')">
            Admin
          </button>
        </div>

        <!-- USER LOGIN -->
        <div class="tab-content active" id="content-user">
          <h2>Xush kelibsiz</h2>
          <p class="sub">Hisobingizga kiring</p>

          <div class="form-group">
            <label>Foydalanuvchi kodi</label>
            <div class="input-wrap">
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="#888"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
              </svg>
              <input
                type="text"
                id="userLogin"
                placeholder="00-913"
                maxlength="10"
              />
            </div>
          </div>

          <div class="form-group">
            <label>Parol</label>
            <div class="input-wrap">
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="#888"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input type="password" id="userPass" placeholder="••••••••" />
              <button class="eye-btn" onclick="togglePass('userPass', this)">
                <svg
                  width="15"
                  height="15"
                  fill="none"
                  stroke="#888"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="error-msg" id="userError"></div>

          <button class="btn-login" onclick="loginUser()">
            <span>Kirish</span>
            <svg
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </button>

          <!-- <div class="divider"><span>yoki</span></div>

          <div class="demo-hint">
            <svg
              width="14"
              height="14"
              fill="none"
              stroke="#888"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-4M12 8h.01" />
            </svg>
            Demo kirish uchun: <strong>00-913</strong> / <strong>123456</strong>
          </div> -->
        </div>

        <!-- ADMIN LOGIN -->
        <div class="tab-content" id="content-admin">
          <h2>Admin kirish</h2>
          <p class="sub">Admin paneliga kirish</p>

          <div class="form-group">
            <label>Login</label>
            <div class="input-wrap">
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="#888"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
              </svg>
              <input type="text" id="adminLogin" placeholder="admin" />
            </div>
          </div>

          <div class="form-group">
            <label>Parol</label>
            <div class="input-wrap">
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="#888"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input type="password" id="adminPass" placeholder="••••••••" />
              <button class="eye-btn" onclick="togglePass('adminPass', this)">
                <svg
                  width="15"
                  height="15"
                  fill="none"
                  stroke="#888"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="error-msg" id="adminError"></div>

          <button class="btn-login admin" onclick="loginAdmin()">
            <span>Admin kirish</span>
            <svg
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </button>

          <!-- <div class="divider"><span>yoki</span></div>

          <div class="demo-hint">
            <svg
              width="14"
              height="14"
              fill="none"
              stroke="#888"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-4M12 8h.01" />
            </svg>
            Demo: <strong>admin</strong> / <strong>admin123</strong>
          </div> -->
        </div>
      </div>

      <p class="footer-text">
        © 2026 Matematika.uz — Barcha huquqlar himoyalangan
      </p>
    </div>

    <script type="module" src="api.js"></script>
    <script src="login-app.js"></script>
  </body>
</html>
