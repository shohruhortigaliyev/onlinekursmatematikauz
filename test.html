<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Test — Online Test</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="test-style.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="brand">Online Test</div>
      <div id="timer">—:—</div>
    </div>

    <div class="layout">
      <main class="quiz">
        <div id="questionCard" class="card"></div>
        <div class="controls">
          <a href="bosh-sahifa.html">
            <button id="prevBtn" class="btn ghost">← Orqaga</button>
          </a>
          <button id="nextBtn" class="btn ghost">Keyingi →</button>
          <button id="finishBtn" class="btn" style="display: none">
            Testni yakunlash
          </button>
        </div>
      </main>

      <aside class="side">
        <h4 id="testTitle">Test</h4>
        <div id="grid" class="grid"></div>
      </aside>
    </div>

    <div id="resultModal" class="modal" style="display: none">
      <div class="modal-card">
        <h3>Natija</h3>
        <div id="resultArea"></div>
        <div style="margin-top: 12px">
          <button id="closeRes" class="btn">Yopish</button>
        </div>
      </div>
    </div>

    <script type="module" src="api.js"></script>
    <script src="test-app.js"></script>
  </body>
</html>
